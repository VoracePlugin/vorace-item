# Objets d'exemple de vorace-item. Tu peux les modifier ou supprimer ce fichier : il ne reviendra pas.
# Chaque entrée est un MODÈLE d'objet ; chaque objet créé à partir d'un modèle est un exemplaire, avec son rang,
# sa place dans la fourchette de stats, sa qualité, son fabricant, ses gemmes et son usure.
#
#   nom            : nom affiché (à la couleur du rang)
#   type           : voir types.yml (il donne les valeurs par défaut : emplacement, scales, vitesse, lignes bonus)
#   rang           : rang de base du modèle. Un modèle n'existe qu'à ce rang, au rang du dessous ou au rang du dessus.
#   etage          : étage du donjon du modèle (son palier fixe la force des lignes bonus)
#   apparence      : materiau (objet du jeu de base), ou objet-vorace (un objet de plugins/Vorace/objets), ou modele
#                    (ressources/modeles/<chemin>.json), ou texture (ressources/textures/<chemin>.png) ; brillance
#   stats          : stats de rang, à leur valeur au RANG DE BASE du modèle (bas de la fourchette)
#   modificateurs  : modificateurs fixes (voir modificateurs.yml)
#   lignes-bonus   : modificateurs qui peuvent être tirés en plus (sinon ceux du type)
#   scales, nature, type-attaque, vitesse-attaque : sinon ceux du type
#   element        : fire, wind, water, earth, ice, lightning, light, dark, holy, corruption (ou en français)
#   durabilite     : 0 ou absent = l'objet ne s'use pas
#   conditions     : niveau, classes (l'objet ne compte que si le joueur les remplit)
#   competences    : clic-droit, clic-gauche, accroupi-clic-droit, accroupi-clic-gauche → compétence (competences.yml)
#   gemmes         : nombre d'emplacements de gemmes (sinon celui du rang)
#   recette        : ce que la forge demande : IRON_INGOT (jeu de base), "vorace:lingot" (vorace-core), "item:gemme" (vorace-item)
#   description    : lignes de texte libres
#   modulaire      : arme assemblée pièce par pièce (les pièces sont dans materiaux/*.yml)

# ----------------------------------------------------------------- arme modulaire
# Une épée = une lame, une garde, une poignée et un pommeau, chacun dans le matériau de son choix.
# Ses stats sont la somme de celles de ses pièces ; son nom vient du matériau de sa première pièce (la lame).
epee:
  nom: "Épée"
  type: epee
  competences:
    clic-droit: entaille
  modulaire:
    emplacements: [lame, garde, poignee, pommeau]
    # rang le plus haut d'une épée assemblée ; au-dessus, ce sont des modèles faits à la main
    rang-max: epique
    nom: "<type> <materiau>"
    # réglages d'affichage communs à toutes les pièces. Les pièces d'exemple sont petites et fines (l'épée tient dans
    # 16 unités, debout, centrée en x = 8 et z = 8, poignée entre y = 2 et y = 5) : elles sont agrandies en main.
    affichage:
      thirdperson_righthand: { rotation: [0, -90, 0], translation: [0, 6.6, 1.5], scale: [2, 2, 2] }
      firstperson_righthand: { rotation: [10, -90, 0], translation: [-1.5, 8.2, 4.75], scale: [1.3, 1.3, 1.3] }
      gui: { rotation: [0, 0, -45], translation: [-0.25, -0.25, 0], scale: [1.4, 1.4, 1] }
      ground: { rotation: [0, 0, 45], translation: [0, 1.5, 0.25] }
      fixed: { rotation: [0, 180, 45], translation: [0.25, -0.25, 0], scale: [1.4, 1.4, 1.4] }

