    texture: exemple/poing/gantelets
  stats:
    attaque: 16
  modificateurs:
    max-health: 20
  durabilite: 220
  recette:
    IRON_INGOT: 3
    LEATHER: 2
  description:
    - "Des plaques de fer sur le dos de la main et les doigts."
    - "Se porte par paire : un objet, les deux mains."
