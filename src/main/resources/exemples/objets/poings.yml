# ----------------------------------------------------------------- armes de poing (Pugiliste de Babel)
# Une paire par objet. Icône dans l'inventaire (outils/exemples-poings.py) ; en main, les gantelets ont un modèle 3D
# autour du poing (outils/poings-3d.py), les autres sont encore invisibles en main.
bandes_de_lin:
  nom: "Bandes de lin"
  type: bandes_de_combat
  rang: commun
  etage: 1
  apparence:
    texture: exemple/poing/bandes_de_combat
    affichage:   # invisibles en main : ce sont les poings qui frappent
      thirdperson_righthand: { scale: [0, 0, 0] }
      thirdperson_lefthand: { scale: [0, 0, 0] }
      firstperson_righthand: { scale: [0, 0, 0] }
      firstperson_lefthand: { scale: [0, 0, 0] }
  stats:
    attaque: 14
  modificateurs:
    critical-strike-chance: 2
  durabilite: 120
  recette:
    STRING: 3
    LEATHER: 1
  description:
    - "L'arme du débutant : du lin serré autour des mains."
    - "Se porte par paire : un objet, les deux mains."
