# Armures d'exemple de vorace-item : trois ensembles assortis aux épées (cuivre, fer, acier), quatre pièces chacun.
# Tu peux les modifier ou supprimer ce fichier : il ne reviendra pas.
#
# Une armure a deux apparences :
#   texture : l'icône dans l'inventaire (ressources/textures/<chemin>.png, 16 x 16)
#   armure  : ce que l'on voit sur le joueur quand elle est portée. Les pièces d'un même ensemble donnent le même
#             chemin : ressources/armures/<chemin>.png habille la tête, le torse, les bras et les pieds, et
#             ressources/armures/<chemin>_jambes.png habille les jambes (textures de 64 x 32, au format des armures
#             du jeu). Sans « armure », la pièce portée a l'apparence de l'objet Minecraft de base (materiau).
# Les stats (armor, magic-armor) sont à leur valeur au rang de base, en bas de la fourchette.

# ----------------------------------------------------------------- cuivre : plaques de légionnaire et lanières de cuir
casque_de_cuivre:
  nom: "Casque de cuivre"
  type: casque
  rang: commun
  etage: 3
  apparence: { materiau: iron_helmet, texture: exemple/armure/cuivre_casque, armure: exemple/cuivre }
  stats: { armor: 8 }
  durabilite: 160
  recette: { COPPER_INGOT: 5 }

plastron_de_cuivre:
  nom: "Plastron de cuivre"
  type: plastron
  rang: commun
  etage: 3
  apparence: { materiau: iron_chestplate, texture: exemple/armure/cuivre_plastron, armure: exemple/cuivre }
