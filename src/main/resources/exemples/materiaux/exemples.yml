      nom: "Garde en croissant"
      modele: exemple/cuivre/garde_croissant
      base: { attaque: 3 }
      cout: { COPPER_INGOT: 1 }
      durabilite: 25
    poignee_cuir:
      kit: epee
      emplacement: poignee
      nom: "Poignée de cuir"
      modele: exemple/cuivre/poignee_cuir
      base: { attaque: 1 }
      cout: { LEATHER: 1, STICK: 1 }
      durabilite: 20
    pommeau_rond:
