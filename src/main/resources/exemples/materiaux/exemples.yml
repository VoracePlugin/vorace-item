# Matériaux d'exemple et leurs pièces pour l'épée modulaire (objets/exemples.yml, « epee »).
# Tu peux modifier ou supprimer ce fichier : il ne reviendra pas.
#
#   nom, complement : « Fer », « de fer » (le complément suit le nom de l'arme : « Épée de fer »)
#   etage           : étage du donjon du matériau. Son palier (tranche de 10 étages) multiplie la base de ses pièces :
#                     x 1 aux étages 1 à 10, x 1,12 aux étages 11 à 20, x 1,25 aux étages 21 à 30...
#   lignes-bonus    : modificateur → poids. Les lignes bonus (leur nombre dépend du rang) restent tirées au hasard dans
#                     la liste du type d'objet, mais celles-ci sortent plus souvent avec ce matériau (poids 1 sinon).
#                     Vaut pour les armes dont la lame est de ce matériau et pour les objets qui déclarent « materiau ».
#   pieces          : pour chaque pièce,
#     kit, emplacement : le modèle modulaire et la place de la pièce (lame, garde, poignee, pommeau)
#     nom              : nom de la pièce
#     modele           : modèle 3D dans plugins/VoraceItem/ressources/modeles (sans « .json »), fait avec Blockbench
#     base             : stats de référence apportées (rang Commun, avant le palier)
#     modificateurs    : modificateurs fixes apportés (facultatif ; les exemples n'en ont pas : les modificateurs
#                        viennent des lignes bonus tirées au hasard, orientées par « lignes-bonus » du matériau)
#     cout             : ce que demande la fabrication de cette pièce (lu par le plugin des métiers)
#     durabilite       : durabilité apportée à l'arme
#
# Les pièces d'exemple sont dessinées par outils/exemples-pieces.py (dépôt vorace-item).

cuivre:
  nom: "Cuivre"
  complement: "de cuivre"
  etage: 1
  lignes-bonus: { attack-speed: 3, critical-strike-chance: 3, movement-speed: 3, dodge-rating: 2 }
  pieces:
    lame_droite:
      kit: epee
      emplacement: lame
      nom: "Lame droite"
      modele: exemple/cuivre/lame_droite
      base: { attaque: 12 }
      cout: { COPPER_INGOT: 2 }
      durabilite: 100
    lame_large:
      kit: epee
      emplacement: lame
      nom: "Lame large"
      modele: exemple/cuivre/lame_large
      base: { attaque: 14 }
      cout: { COPPER_INGOT: 3 }
      durabilite: 130
    garde_droite:
      kit: epee
      emplacement: garde
      nom: "Garde droite"
      modele: exemple/cuivre/garde_droite
      base: { attaque: 2 }
      cout: { COPPER_INGOT: 1 }
      durabilite: 30
    garde_croissant:
      kit: epee
