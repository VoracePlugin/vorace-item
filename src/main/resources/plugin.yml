name: VoraceItem
version: '${version}'
main: fr.vorace.item.VoraceItem
api-version: '1.21.4'
description: Création des objets RPG pour Vorace (stats, rangs, qualité, armes modulaires, durabilité)
authors: [ORA-KUN, AntoineJarnoux]
website: https://github.com/VoracePlugin/vorace-item
depend: [Vorace]
commands:
  vitem:
    description: Objets RPG de vorace-item
    usage: /vitem [donner|assembler|piece|monter|catalogue|info|reparer|nommer|profil|pack|recharger|essai]
    aliases: [voraceitem, vi]
    permission: voraceitem.admin
permissions:
  voraceitem.admin:
    description: Toutes les commandes de vorace-item
    default: op
