name: Compilation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # vorace-core (plugin « Vorace ») compilé depuis sa branche main : vorace-item compile contre lui
      - uses: actions/checkout@v5
        with:
          repository: VoracePlugin/vorace-core
          path: vorace-core
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.2.0"
      - name: Compiler vorace-core
        run: cd vorace-core && gradle build -x test -PpaperApi="1.21.1-R0.1-SNAPSHOT" && ls build/libs
      - name: Compiler vorace-item
        run: gradle build -PvoraceCore="$(ls $PWD/vorace-core/build/libs/Vorace-*.jar | head -1)"
      - name: Garder les .jar
        run: mkdir -p jars && cp vorace-core/build/libs/Vorace-*.jar build/libs/VoraceItem-*.jar jars/
      - uses: actions/upload-artifact@v4
        with:
          name: VoraceItem
          path: jars/*.jar
